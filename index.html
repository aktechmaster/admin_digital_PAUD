<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Admin Digital PAUD IT Al-Kautsar</title>
    <link rel="icon" type="image/png" href="digital.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Elemen Dekoratif Latar Belakang */
        .bg-shape {
            position: absolute;
            border-radius: 50%;
            opacity: 0.4;
            z-index: 0;
        }
        .shape-1 {
            width: 250px;
            height: 250px;
            background: #FFE082;
            top: -60px;
            left: -60px;
        }
        .shape-2 {
            width: 320px;
            height: 320px;
            background: #81D4FA;
            bottom: -100px;
            right: -80px;
        }

        .login-card {
            position: relative;
            z-index: 1;
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 35px 30px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
            text-align: center;
            border: 4px solid #ffffff;
        }

        .logo-container {
            margin-bottom: 15px;
        }

        .logo-container img {
            max-width: 90px;
            max-height: 90px;
            object-fit: contain;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.08));
        }

        .login-card h2 {
            color: #2C3E50;
            margin-bottom: 6px;
            font-size: 22px;
            font-weight: 700;
        }

        .login-card p {
            color: #7F8C8D;
            font-size: 13px;
            margin-bottom: 22px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #34495E;
            font-size: 13px;
            font-weight: 700;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #E0E0E0;
            border-radius: 14px;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
            background-color: #F9F9F9;
        }

        .form-group input:focus {
            border-color: #4FC3F7;
            background-color: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(79, 195, 247, 0.2);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #FF7043 0%, #FF5722 100%);
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(255, 87, 34, 0.25);
            transition: all 0.2s ease;
            margin-top: 10px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 87, 34, 0.35);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .error-message {
            background: #FFEBEE;
            color: #E53935;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 18px;
            display: none;
            border: 1px solid #FFCDD2;
        }
    </style>
</head>
<body>

    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <div class="login-card">
        <div class="logo-container">
            <img src="digital.png" alt="Logo PAUD IT Al-Kautsar">
        </div>

        <h2>Admin Digital PAUD</h2>
        <p>Silakan masuk untuk mengakses dashboard</p>

        <div id="errorAlert" class="error-message">
            Username atau password salah!
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Masukkan username" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Masukkan password" required>
            </div>

            <button type="submit" class="btn-login">Masuk</button>
        </form>
    </div>

    <script>
        // Data Username dan Password yang diizinkan (Tidak Diubah)
        const validUsers = {
            "paudit1": "69760588",
            "paudit2": "69905448"
        };

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value.trim();
            const errorAlert = document.getElementById('errorAlert');

            // Validasi Login
            if (validUsers[usernameInput] && validUsers[usernameInput] === passwordInput) {
                // Simpan status sesi login
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('currentUser', usernameInput);
                
                // Pindah ke halaman dashboard
                window.location.href = 'dashboard.html';
            } else {
                // Tampilkan pesan kesalahan
                errorAlert.style.display = 'block';
            }
        });
    </script>

</body>
</html>
